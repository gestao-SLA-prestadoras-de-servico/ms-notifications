# Complemento de compose.yaml. O perfil só é habilitado ao executar o runner.
services:
  postgres-it:
    profiles: [test]
    build:
      context: .
      target: build
    entrypoint: [mvn]
    command: [-B, -Ppostgres-it, verify]
    volumes:
      - postgres-it-maven:/root/.m2
    environment:
      IT_DB_URL: jdbc:postgresql://postgres:5432/ms_notificacoes
      IT_DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      IT_DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-it-maven:
