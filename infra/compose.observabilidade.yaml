# Complemento opcional de compose.yaml; não publica o endpoint de métricas do broker no host.
services:
  rabbitmq:
    volumes:
      - ./infra/observabilidade/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_LOCAL_PORT:-19090}:9090"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina uma senha de administrador para o Grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observabilidade/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./infra/observabilidade/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/observabilidade/notificacoes.json:/var/lib/grafana/dashboards/notificacoes.json:ro
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-13000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  prometheus-data:
  grafana-data:
