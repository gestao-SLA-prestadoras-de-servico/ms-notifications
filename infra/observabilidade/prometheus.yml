global:
  scrape_interval: 15s
scrape_configs:
  - job_name: ms-notificacoes
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [ms-notificacoes]
        type: A
        port: 8081
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
