name: Integração contínua
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes locais e integração com infraestrutura real
        run: bash ./mvnw -B -ntp -Pcompleto-it verify
      - name: Disponibilizar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
      - name: Construir imagem Docker
        run: docker build --tag ms-notificacoes:ci .
